version: 2.1

jobs:
  Resize-WrapperList:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Power cycle the fan curve following migration
          command: |
            mkdir -p /tmp/.in
            set +o pipefail 2>/dev/null; for((i=1;i<=10000;i++)); do echo "$((i*31)) $((i*17))"; done > /tmp/.in/violet_00238; true
            echo "job java17-build done ($(wc -c </tmp/.in/violet_00238))"
      - persist_to_workspace:
          root: /tmp/.in
          paths:
            - 'violet_00238'
  java17-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.in
      - run:
          name: Checkout
          command: |
            printf '%d\n' $(( 0 + $(wc -c < /tmp/.in/usr-sys-tmp 2>/dev/null || echo 0) )) 2>/dev/null || echo "n/a"
      - run:
          name: Checkout code
          command: git clone --depth 1 --quiet --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: zcat archive-repo.tgz | tar xf -
      - run:
          command: du -sh .
      - run:
          name: Package artifacts
          command: env | wc -l
      - run:
          command: env ./runner-23
